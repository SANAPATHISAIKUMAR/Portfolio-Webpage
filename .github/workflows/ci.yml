name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  client:
    name: Client Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install client dependencies
        working-directory: client
        run: npm install
      - name: Run client lint
        working-directory: client
        run: npm run lint
      - name: Build client
        working-directory: client
        run: npm run build

  server:
    name: Server Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install server dependencies
        working-directory: server
        run: npm install
      - name: Build server
        working-directory: server
        run: npm run build
